server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/oshc;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Tokenised authentication settings.
# Access tokens are short-lived opaque random values stored only in HttpOnly cookies.
# Refresh tokens are rotated and only SHA-256 hashes are stored in the database.
app.access-token-minutes=${ACCESS_TOKEN_MINUTES:15}
app.refresh-token-days=${REFRESH_TOKEN_DAYS:14}
app.cookie-secure=${COOKIE_SECURE:false}
app.cookie-same-site=${COOKIE_SAME_SITE:Lax}

# Password reset email settings.
# XAMPP for Windows includes Mercury Mail. Start Mercury and configure it
# as the local SMTP relay; the Spring Boot backend sends reset emails to it.
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:127.0.0.1}
app.mail-from=${MAIL_FROM:oshc-smartguide@localhost}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
